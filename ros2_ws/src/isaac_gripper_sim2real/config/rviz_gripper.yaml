# RViz joint_state merger: arm /dsr01/joint_states + /gripper/state (pulse) -> /dsr01/joint_states_rviz
rviz_joint_state_merger:
  ros__parameters:
    robot_ns: dsr01
    arm_joint_states_topic: ""
    gripper_state_topic: /gripper/state
    output_joint_states_topic: ""
    open_rad: 0.0
    closed_rad: 1.101
    pulse_open: 0
    pulse_closed: 700
    publish_hz: 20.0
    publish_all_gripper_joints: true
    poll_gripper_service: true
    gripper_service_name: /gripper/get_state
